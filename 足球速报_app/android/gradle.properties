org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# 项目路径含中文（定时球报），关闭 AGP 的 ASCII 路径检查；实际构建经由 C:\fbwork junction 以 ASCII 路径进行
android.overridePathCheck=true
# 插件模块极小，禁用 Kotlin 增量编译与独立守护进程，规避 IC 缓存跨盘符/残留注册的 bug
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
